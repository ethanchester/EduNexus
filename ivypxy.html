<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open IVY</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        gap: 1rem;
        padding: 1rem;
        box-sizing: border-box;
        background: #f2f6fc;
      }

      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 1rem 1.5rem;
        background: #007bff;
        color: #fff;
        font: inherit;
        font-size: 1.25rem;
        cursor: pointer;
      }

      button:hover {
        background: #005fc4;
      }

      button:focus-visible {
        outline: 3px solid #163f72;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <button
      data-ivy-url="https://cdn.jsdelivr.net/gh/ethanchester/ivyyy@main/index.xml"
      type="button"
    >
      Open IVY (Mine)
    </button>
    <button
      data-ivy-url="https://cdn.jsdelivr.net/gh/3cfl/ivy-static@main/index.svg"
      type="button"
    >
      Open IVY (Main)
    </button>

    <script>
      document.querySelectorAll("button[data-ivy-url]").forEach((button) => {
        button.addEventListener("click", () => openIvy(button.dataset.ivyUrl));
      });

      function openIvy(url) {
        const ivyWindow = window.open("about:blank", "_blank");

        if (!ivyWindow) {
          window.alert(
            "The new tab was blocked. Allow pop-ups for this site and try again."
          );
          return;
        }

        try {
          ivyWindow.opener = null;

          const popupDocument = ivyWindow.document;
          popupDocument.title = "Ivy";
          popupDocument.documentElement.lang = "en";
          popupDocument.documentElement.style.cssText =
            "width:100%;height:100%;margin:0;overflow:hidden";
          popupDocument.body.style.cssText =
            "width:100%;height:100%;margin:0;overflow:hidden;background:#fff";

          const ivyFrame = popupDocument.createElement("iframe");
          ivyFrame.src = url;
          ivyFrame.title = "IVY content";
          ivyFrame.allow = "fullscreen";
          ivyFrame.allowFullscreen = true;
          ivyFrame.style.cssText =
            "position:fixed;inset:0;width:100%;height:100%;border:0;opacity:1;z-index:0;background:#fff;";

          const wcpssFrame = popupDocument.createElement("iframe");
          wcpssFrame.src = "https://www.wcpss.net/";
          wcpssFrame.title = "WCPSS";
          wcpssFrame.allow = "fullscreen";
          wcpssFrame.allowFullscreen = true;
          wcpssFrame.style.cssText =
            "position:fixed;inset:0;width:100%;height:100%;border:0;opacity:1;z-index:1;background:#fff;";

          popupDocument.body.appendChild(ivyFrame);
          popupDocument.body.appendChild(wcpssFrame);

          const overlay = popupDocument.createElement("div");
          overlay.style.cssText =
            "position:fixed;inset:0;z-index:2;pointer-events:none;background:transparent;";
          popupDocument.body.appendChild(overlay);
        } catch {
          ivyWindow.close();
          window.alert("The new tab could not be opened. Please try again.");
        }
      }
    </script>
  </body>
</html>
