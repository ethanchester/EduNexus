<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open IVY</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f2f6fc;
      }

      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 1rem 1.5rem;
        background: #007bff;
        color: #fff;
        font: inherit;
        font-size: 1.25rem;
        cursor: pointer;
      }

      button:hover {
        background: #005fc4;
      }

      button:focus-visible {
        outline: 3px solid #163f72;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <button id="open-ivy" type="button">Click to open IVY</button>

    <script>
      document.getElementById("open-ivy").addEventListener("click", () => {
        const ivy = window.open("about:blank", "_blank");

        if (!ivy) {
          window.alert("The new tab was blocked. Allow pop-ups for this site and try again.");
          return;
        }

        // Prevent the opened page from navigating this page through window.opener.
        ivy.opener = null;
        ivy.document.open();
        ivy.document.write(`<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ivy</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <iframe src="https://cdn.jsdelivr.net/gh/3cfl/ivy-static@main/index.xml#/l" title="Full Screen Content" allow="fullscreen" allowfullscreen></iframe>
</body>
</html>`);
        ivy.document.close();
      });
    </script>
  </body>
</html>
