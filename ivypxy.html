<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open IVY</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f2f6fc;
      }

      button {
        border: 0;
        border-radius: 0.75rem;
        padding: 1rem 1.5rem;
        background: #007bff;
        color: #fff;
        font: inherit;
        font-size: 1.25rem;
        cursor: pointer;
      }

      button:hover {
        background: #005fc4;
      }

      button:focus-visible {
        outline: 3px solid #163f72;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <button id="open-ivy" type="button">Click to open IVY</button>

    <script>
      document.getElementById("open-ivy").addEventListener("click", () => {
        const ivy = window.open("about:blank", "_blank");

        if (!ivy) {
          window.alert("The new tab was blocked. Allow pop-ups for this site and try again.");
          return;
        }

        // Build the popup DOM directly; no HTML string or document.write is needed.
        ivy.opener = null;
        const popupDocument = ivy.document;
        popupDocument.title = "Ivy";
        popupDocument.documentElement.lang = "en";
        popupDocument.documentElement.style.cssText =
          "width:100%;height:100%;margin:0;overflow:hidden";
        popupDocument.body.style.cssText =
          "width:100%;height:100%;margin:0;overflow:hidden";

        const frame = popupDocument.createElement("iframe");
        frame.src = "https://cdn.jsdelivr.net/gh/3cfl/ivy-static@main/index.xml#/l";
        frame.title = "Full Screen Content";
        frame.allow = "fullscreen";
        frame.allowFullscreen = true;
        frame.style.cssText =
          "position:fixed;inset:0;width:100%;height:100%;border:0";
        popupDocument.body.appendChild(frame);
      });
    </script>
  </body>
</html>
